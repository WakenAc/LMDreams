<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <title>Imagem de partilha LMDreams</title>
    <style>
      @font-face {
        font-family: 'Schibsted Grotesk Variable';
        src: url('{{FONT_DISPLAY}}') format('woff2-variations');
        font-weight: 400 900;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('{{FONT_MONO}}') format('woff2');
        font-weight: 500;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #292929; }
      .card { position: relative; width: 1200px; height: 630px; color: #f2f1ec; }
      .foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{HERO_POSITION}}; }
      .veu {
        position: absolute; inset: 0;
        background: linear-gradient(90deg, rgb(41 41 41 / 0.95) 0%, rgb(41 41 41 / 0.88) 46%, rgb(41 41 41 / 0.55) 100%);
      }
      .planta { position: absolute; inset: 0; width: 100%; height: 100%; }
      .conteudo { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 640px; display: flex; flex-direction: column; }
      .marca { display: flex; align-items: center; gap: 18px; }
      .marca img { height: 64px; width: auto; display: block; }
      .marca span { font-family: 'Schibsted Grotesk Variable', Arial, sans-serif; font-weight: 650; font-size: 34px; letter-spacing: -0.01em; }
      .cota { margin-top: auto; display: flex; align-items: center; gap: 10px; color: #d0b47c; }
      .cota svg { display: block; }
      h1 {
        margin-top: 22px;
        font-family: 'Schibsted Grotesk Variable', Arial, sans-serif;
        font-weight: 620; font-size: 60px; line-height: 1.04; letter-spacing: -0.03em;
      }
      .area {
        margin-top: 26px;
        font-family: 'IBM Plex Mono', Consolas, monospace; font-weight: 500; font-size: 16px;
        letter-spacing: 0.08em; text-transform: uppercase; color: #b7b5ae;
      }
      .legenda {
        position: absolute; right: 24px; bottom: 22px;
        font-family: 'IBM Plex Mono', Consolas, monospace; font-weight: 500; font-size: 15px;
        background: rgb(41 41 41 / 0.86); color: #f2f1ec; padding: 6px 10px; border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      {{BACKGROUND}}
      <div class="conteudo">
        <div class="marca">
          <img src="{{LOGO}}" alt="" />
          <span>LMDreams</span>
        </div>
        <div class="cota" aria-hidden="true">
          <svg width="120" height="14" viewBox="0 0 120 14">
            <path d="M0 7H120M0 1v12M120 1v12" stroke="#80868e" stroke-width="1.5" fill="none" />
            <path d="M-4 11l8-8M116 11l8-8" stroke="#d0b47c" stroke-width="1.5" fill="none" />
          </svg>
        </div>
        <h1>Cada especialidade nas mãos de quem realmente sabe.</h1>
        <p class="area">Construção civil e remodelações · Portugal continental</p>
      </div>
      {{CAPTION}}
    </div>
  </body>
</html>
