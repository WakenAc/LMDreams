name: CI

# Em pull requests (e manualmente): faz a mesma verificação que bloqueia a publicação.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # histórico completo: o sitemap usa a data do último commit de cada página
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Confirmar que as páginas geradas (obras e vagas) estão atualizadas
        run: |
          node scripts/gerar-obras.cjs
          node scripts/gerar-vagas.cjs
          if [ -n "$(git status --porcelain -- obras trabalhe-connosco index.html)" ]; then
            git status --porcelain -- obras trabalhe-connosco index.html
            echo "::error::páginas geradas desatualizadas: corra node scripts/gerar-obras.cjs e node scripts/gerar-vagas.cjs e faça commit"
            exit 1
          fi
      - name: Preparar dist/
        run: node scripts/publicar.cjs
      - name: Verificar ligações, recursos de terceiros e originais
        run: node scripts/verificar.cjs
