name: CI

# Em pull requests (e manualmente): faz a mesma verificação que bloqueia a publicação.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Preparar dist/
        run: node scripts/publicar.cjs
      - name: Verificar ligações, recursos de terceiros e originais
        run: node scripts/verificar.cjs
