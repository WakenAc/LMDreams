name: Deploy to GitHub Pages

# Site estático: não há build nem dependências. Copia só os ficheiros do site para dist/,
# verifica-os (ligações, recursos de terceiros, originais) e publica no GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # histórico completo: o sitemap usa a data do último commit de cada página
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Confirmar que as páginas das obras estão atualizadas
        run: |
          node scripts/gerar-obras.cjs
          if [ -n "$(git status --porcelain -- obras)" ]; then
            git status --porcelain -- obras
            echo "::error::obras/ desatualizado: corra node scripts/gerar-obras.cjs e faça commit"
            exit 1
          fi
      - name: Preparar dist/ (só os ficheiros do site)
        run: node scripts/publicar.cjs
      - name: Bloquear a publicação se houver ligações partidas, recursos de terceiros ou originais
        run: node scripts/verificar.cjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
