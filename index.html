  <body>
    <div id="root"></div>
    <!--
      Complemento do truque de redireccionamento em public/404.html
      (https://github.com/rafgraph/spa-github-pages): reconstitui o
      caminho original a partir da query string antes de o React Router
      assumir o controlo da navegação.
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
